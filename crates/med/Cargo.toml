[package]
name = "med"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A modal (vim-style) code editor built on GPUI"
repository = "https://github.com/iceice666/med"

[dependencies]
med-core = { path = "../med-core" }
med-vim = { path = "../med-vim" }
med-lsp = { path = "../med-lsp" }
med-git = { path = "../med-git" }
med-lisp = { path = "../med-lisp" }
gpui.workspace = true
anyhow.workspace = true
futures.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
ropey = "1.6"
regex = "1"
# Must stay on the tree-sitter that gpui-component's grammars are built for.
tree-sitter = "0.26"
tree-sitter-nix = "0.3"
ignore = "0.4"
nucleo-matcher = "0.3"
# blink.cmp's fuzzy matcher, for LSP completion.
frizbee = "0.13"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
trash = "5.3.0"

[[test]]
name = "lsp"
harness = false

[dev-dependencies]
# gpui-kit's own `test-support` feature drags in an unpublished gpui-fast;
# enabling it on the underlying GPUI crate is enough for `#[gpui::test]`.
gpui-test-support = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

# `cargo packager -p med --release` turns target/release/med into the
# .app/.dmg (macOS) and .deb/.AppImage (Linux) attached to each release.
[package.metadata.packager]
product-name = "med"
identifier = "dev.med.editor"
authors = ["Brian Duan"]
category = "DeveloperTool"
binaries = [{ path = "med", main = true }]
# A placeholder; the AppImage cannot be made without a square icon.
icons = ["icons/med.png"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
# Ad-hoc: sealed, but by no Apple developer, so a downloaded copy needs
# its quarantine cleared (see the README).
signing-identity = "-"

# What GPUI loads at run time on Linux: fonts, Wayland or X11, Vulkan.
[package.metadata.packager.deb]
depends = [
  "libc6",
  "libfontconfig1",
  "libfreetype6",
  "libwayland-client0",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libx11-xcb1",
  "libxcb1",
  "libvulkan1",
]
