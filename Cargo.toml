[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "MIT"
# Nothing here goes to crates.io: releases are the binaries on GitHub.
publish = false

[workspace.dependencies]
# gpui-kit re-exports GPUI (gpui-pre snapshot) + gpui-base + gpui-component.
# Renamed to `gpui` so GPUI derive/macro output resolves.
gpui = { package = "gpui-kit", version = "0.9.1", features = ["tree-sitter-languages"] }
anyhow = "1"
futures = "0.3"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
