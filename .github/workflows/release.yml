# On every push to main, release-plz keeps a release PR open (version bump +
# CHANGELOG.md). Merging it tags `v{version}` and creates the GitHub release;
# the `package` jobs then build med and attach the macOS and Linux packages.
#
# Tags made with GITHUB_TOKEN start no other workflow, so packaging runs here,
# as jobs that need the release job, rather than on `push: tags`.
#
# Repository setting needed once: Settings → Actions → General → Workflow
# permissions → "Allow GitHub Actions to create and approve pull requests".

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and attach packages to, e.g. v0.2.0
        required: true

permissions: {}

jobs:
  release-pr:
    name: Release PR
    if: github.event_name == 'push' && github.repository_owner == 'iceice666'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    if: github.event_name == 'push' && github.repository_owner == 'iceice666'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: echo "tag=$(jq -r '.[] | select(.package_name == "med") | .tag' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.name }})
    needs: release
    # `always()` lets a manual run go ahead though `release` was skipped.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release.outputs.tag != '') ||
        github.event_name == 'workflow_dispatch'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            formats: app,dmg
          - name: Linux x86_64
            os: ubuntu-24.04
            formats: deb,appimage
          - name: Linux arm64
            os: ubuntu-24.04-arm
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan1
      # cargo-about writes the third-party licence file the packages carry.
      # Its binary needs the `cli` feature; without it cargo installs
      # nothing and still succeeds.
      - name: Install cargo-packager and cargo-about
        run: |
          cargo install cargo-packager --locked
          cargo install cargo-about --locked --features cli
      - name: Build
        run: cargo build -p med --release
      # A relative --out-dir is taken from crates/med, so give a full path.
      # The AppImage tools run unpacked, needing no FUSE on the runner.
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager -p med --release --formats ${{ matrix.formats }} --out-dir "$GITHUB_WORKSPACE/dist"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-assets.sh "$TAG" "$GITHUB_WORKSPACE/dist"
